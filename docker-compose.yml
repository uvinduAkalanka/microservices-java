version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: generic
      MYSQL_DATABASE: employee
      MYSQL_USER: myRoot
      MYSQL_PASSWORD: generic
      MYSQL_ROOT_HOST: '%'  # Allows connections from any host
    restart: always
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-scripts:/usr/db-scripts

